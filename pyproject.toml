[project]
name = "vyos-mgmt"
version = "0.1.0"
description = "Web management console for VyOS routers (FastAPI + Next.js)"
readme = "README.md"
authors = [
    { name = "tuna2134", email = "hello@tuna2134.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "cryptography>=44.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "pyvyos>=0.4.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
vyos-mgmt = "vyos_mgmt.cli:main"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF012"]

[tool.coverage.run]
source = ["vyos_mgmt"]
